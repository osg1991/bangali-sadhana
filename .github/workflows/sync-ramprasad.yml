name: Sync Ramprasad content

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"
  push:
    branches:
      - main
    paths:
      - scripts/sync-ramprasad-v13.mjs
      - content/ramprasad-vocabulary.json
      - tests/**
      - package.json
      - package-lock.json
      - .github/workflows/sync-ramprasad.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/**
      - content/ramprasad-vocabulary.json
      - tests/**
      - package.json
      - package-lock.json
      - .github/workflows/sync-ramprasad.yml
  issues:
    types:
      - opened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-ramprasad-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name != 'issues' ||
      startsWith(github.event.issue.title, '[sync-content]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out Bengali Sadhana
        uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Check out Ramprasad Sen archive
        uses: actions/checkout@v4
        with:
          repository: osg1991/RamprasadSen
          path: RamprasadSen

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Import all songs and lyric vocabulary
        working-directory: app
        run: npm run sync:ramprasad -- --source ../RamprasadSen

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Validate PWA
        working-directory: app
        run: npm run validate

      - name: Commit generated changes
        working-directory: app
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if git diff --quiet -- content/generated; then
            echo "No generated content changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/generated
          git commit -m "chore: sync complete Ramprasad content"
          git push origin "HEAD:${TARGET_BRANCH}"
